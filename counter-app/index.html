<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <!-- Header Section -->
        <header class="app-header">
            <div class="badge">SMIT JS Module Assignment</div>
            <h1>Counter Studio</h1>
            <p id="time-display" class="time-stamp">Date Loading...</p>
        </header>

        <!-- Main Display -->
        <div class="counter-display-wrapper">
            <span id="counter-value" class="counter-value">0</span>
            <div id="status-badge" class="status-badge">Even • Neutral</div>
        </div>

        <!-- Controls Grid -->
        <div class="control-grid">
            <button class="btn btn-primary" onclick="changeCounter('increment')">+ Increase</button>
            <button class="btn btn-secondary" onclick="changeCounter('decrement')">- Decrease</button>
            <button class="btn btn-accent" onclick="changeCounter('step')">+ Step Size</button>
            <button class="btn btn-reset" onclick="resetCounter()">↺ Reset</button>
        </div>

        <!-- Controls & Configuration Form -->
        <div class="config-panel">
            <div class="input-group">
                <label for="step-input">Custom Step Size</label>
                <input type="number" id="step-input" value="5" min="1" max="100">
            </div>
            <div class="input-group">
                <label for="max-input">Upper Limit (Max)</label>
                <input type="number" id="max-input" value="50">
            </div>
        </div>

        <!-- Utility Actions -->
        <div class="action-bar">
            <button class="btn btn-ghost" onclick="generateRandom()">🎲 Random Value</button>
            <button class="btn btn-ghost" onclick="logSnapshot()">📸 Save Snapshot</button>
            <button class="btn btn-danger" onclick="clearLogs()">🗑️ Clear History</button>
        </div>

        <!-- History & Logs Table -->
        <div class="history-section">
            <h3>Activity History & Snapshots</h3>
            <div class="table-container">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Time</th>
                            <th>Value</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
